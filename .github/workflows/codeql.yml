name: "Perform CodeQL Analysis"

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/**'
      - '!**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - '**'
      - '!.github/**'
      - '!**/*.md'
  schedule:
    - cron: '52 13 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analysis-call:
    uses: vyos/.github/.github/workflows/codeql-analysis.yml@production
    with:
      languages: "['python']"
