set vpp acl ip interface eth1 input acl-tag 1 tag-name 'WEB-IN'
set vpp acl ip interface eth1 input acl-tag 2 tag-name 'MGMT'
set vpp acl ip interface eth1 output acl-tag 1 tag-name 'WEB-OUT'
set vpp acl ip tag-name MGMT rule 10 action 'permit'
set vpp acl ip tag-name WEB-IN description 'Inbound web traffic'
set vpp acl ip tag-name WEB-IN rule 10 action 'permit'
set vpp acl ip tag-name WEB-IN rule 10 description 'Allow HTTPS from partners'
set vpp acl ip tag-name WEB-IN rule 10 destination port '443'
set vpp acl ip tag-name WEB-IN rule 10 destination prefix '198.51.100.10/32'
set vpp acl ip tag-name WEB-IN rule 10 protocol 'tcp'
set vpp acl ip tag-name WEB-IN rule 10 source port '1024-65535'
set vpp acl ip tag-name WEB-IN rule 10 source prefix '192.0.2.0/24'
set vpp acl ip tag-name WEB-IN rule 10 tcp-flags is-not-set 'ack'
set vpp acl ip tag-name WEB-IN rule 10 tcp-flags is-set 'syn'
set vpp acl ip tag-name WEB-IN rule 20 action 'deny'
set vpp acl ip tag-name WEB-OUT rule 10 action 'permit-reflect'
set vpp acl mac interface eth1 tag-name 'MAC-FILTER'
set vpp acl mac tag-name MAC-FILTER rule 10 action 'permit'
set vpp acl mac tag-name MAC-FILTER rule 10 mac-address '00:11:22:33:44:55'
set vpp acl mac tag-name MAC-FILTER rule 10 mac-mask 'ff:ff:ff:00:00:00'
set vpp acl mac tag-name MAC-FILTER rule 10 prefix '192.0.2.0/24'
