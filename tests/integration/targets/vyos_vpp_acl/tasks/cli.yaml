---
- name: Collect all cli test cases
  ansible.builtin.find:
    paths: "{{ role_path }}/tests/cli"
    patterns: "{{ testcase }}.yaml"
    use_regex: true
  register: test_cases
  delegate_to: localhost

- name: Set test_items
  ansible.builtin.set_fact:
    test_items: "{{ test_cases.files | map(attribute='path') | list }}"

# ACLs bind to dataplane interfaces; VyOS restarts the dataplane whenever its settings
# change, so it is enabled once for all test cases and removed once at the end.
- name: Run test cases with the dataplane enabled
  vars:
    ansible_connection: ansible.netcommon.network_cli
  block:
    - name: Enable the dataplane on eth2
      ansible.builtin.include_tasks: "{{ role_path }}/tests/cli/_setup_dataplane.yaml"

    - name: Run test case (connection=ansible.netcommon.network_cli)
      ansible.builtin.include_tasks: "{{ test_case_to_run }}"
      with_items: "{{ test_items }}"
      loop_control:
        loop_var: test_case_to_run

  always:
    - name: Remove the dataplane
      ansible.builtin.include_tasks: "{{ role_path }}/tests/cli/_remove_dataplane.yaml"
