---
- debug:
    msg: START vyos_vpp_acl overridden integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml

- include_tasks: _populate_config.yaml

- block:
    - name: Apply the configuration (overridden)
      register: result
      vyos.vyos.vyos_vpp_acl: &id001
        config: "{{ overridden.config }}"
        state: overridden

    - assert:
        that:
          - result.changed == true
          - result.commands|symmetric_difference(overridden.commands) == []
          - result.after == overridden.after

    - name: Apply the configuration (overridden, IDEMPOTENT)
      register: result
      vyos.vyos.vyos_vpp_acl: *id001

    - name: Assert that the previous task was idempotent
      assert:
        that:
          - result['changed'] == false

  always:
    - include_tasks: _remove_config.yaml
