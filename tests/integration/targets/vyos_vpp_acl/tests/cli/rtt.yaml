---
- debug:
    msg: START vyos_vpp_acl round trip integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml

- block:
    - name: Apply the provided configuration (base config)
      register: base_config
      vyos.vyos.vyos_vpp_acl:
        config: "{{ base }}"
        state: merged

    - name: Gather dataplane ACL facts
      vyos.vyos.vyos_facts:
        gather_subset:
          - default
        gather_network_resources:
          - vpp_acl

    - name: Apply the provided configuration (config to be reverted)
      register: result
      vyos.vyos.vyos_vpp_acl:
        config:
          ip:
            acls:
              - name: WEB-IN
                rules:
                  - number: 10
                    tcp_flags:
                      is_set:
                        - fin
                  - number: 30
                    action: deny
                    protocol: udp
        state: merged

    - name: Assert that changes were applied
      assert:
        that: result['after'] == round_trip['after']

    - name: Revert back to base config using facts round trip
      register: revert
      vyos.vyos.vyos_vpp_acl:
        config: "{{ ansible_facts['network_resources']['vpp_acl'] }}"
        state: overridden

    - name: Assert that config was reverted
      assert:
        that: revert['after'] == base_config['after']

  always:
    - include_tasks: _remove_config.yaml
