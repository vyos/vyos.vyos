---
- debug:
    msg: START vyos_bgp_global replaced integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml

- include_tasks: _populate_af.yaml

- block:
    - name: Replace the existing af configuration with the provided running configuration
      register: result
      ignore_errors: true
      vyos.vyos.vyos_bgp_global:
        config:
          as_number: "65536"
          bgp_params:
            always_compare_med: true
            dampening:
              start_suppress_time: 5
              max_suppress_time: 20
              half_life: 33
              re_use: 60
            bestpath:
              as_path: confed
              compare_routerid: true
          neighbor:
            - address: 192.0.2.43
              disable_connected_check: true
              advertisement_interval: 72
              capability:
                dynamic: true
              timers:
                holdtime: 30
                keepalive: 10
              remote_as: 102
            - address: 203.0.113.0
              capability:
                dynamic: true
              remote_as: 102
        state: replaced

    - assert:
        that:
          - result.msg == 'Use the _bgp_address_family module to delete the address_family under neighbor 5001::64, before replacing/deleting the neighbor.'

    - name: Peer group with an address family (1.4 and later)
      when: vyos_version is version('1.4.0', '>=', version_type='semver')
      block:
        - name: Add a peer group with an address family
          vyos.vyos.vyos_config:
            lines:
              - set protocols bgp peer-group RR-CLIENTS remote-as '65536'
              - set protocols bgp peer-group RR-CLIENTS address-family 'ipv4-unicast'
          vars:
            ansible_connection: ansible.netcommon.network_cli

        - name: Replace without the peer group that has an address family
          register: result
          ignore_errors: true
          vyos.vyos.vyos_bgp_global:
            config:
              as_number: "65536"
              neighbor:
                - address: 5001::64
            state: replaced

        - assert:
            that:
              - result.msg == 'Use the _bgp_address_family module to delete the address_family under neighbor RR-CLIENTS, before replacing/deleting the neighbor.'

  always:
    - include_tasks: _remove_config.yaml
