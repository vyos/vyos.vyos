---
- debug:
    msg: START vyos_bgp_address_family merged integration tests on connection={{ ansible_connection }}

- include_tasks: _remove_config.yaml

- include_tasks: _preconfig.yaml

- block:
    - name: Merge the provided configuration with the existing running configuration
      register: result
      vyos.vyos.vyos_bgp_address_family: &id001
        config:
          as_number: "65536"
          address_family:
            - afi: ipv6
              redistribute:
                - protocol: static
                  metric: 50
          neighbors:
            - neighbor_address: 203.0.113.5
              address_family:
                - afi: ipv6
                  allowas_in: 4
                  attribute_unchanged:
                    med: true
                  default_originate: map01
                  distribute_list:
                    - action: export
                      acl: 10
            - neighbor_address: 192.0.2.25
              address_family:
                - afi: ipv6
                  maximum_prefix: 45
                  nexthop_self: true
                  route_map:
                    - action: export
                      route_map: map01
                    - action: import
                      route_map: map01
        state: merged

    - vyos.vyos.vyos_facts:
        gather_network_resources: bgp_address_family

    - assert:
        that:
          - result.commands|length == merged.commands|length
          - result.changed == true
          - result.commands|symmetric_difference(merged.commands) == []
          - result.after == ansible_facts['network_resources']['bgp_address_family']
          - result.before == merged.before
          - result.after == merged.after

    - name: Merge the provided configuration with the existing running configuration (IDEMPOTENT)
      register: result
      vyos.vyos.vyos_bgp_address_family: *id001

    - name: Assert that the previous task was idempotent
      assert:
        that:
          - result['changed'] == false

  always:
    - include_tasks: _remove_config.yaml

- include_tasks: _get_version.yaml

- block:
    - name: setup an iBGP neighbor
      vyos.vyos.vyos_config:
        lines:
          - set protocols bgp system-as 65536
          - set protocols bgp neighbor 192.0.2.50 remote-as internal
      vars:
        ansible_connection: ansible.netcommon.network_cli

    - name: Merge VPN address families for a route-reflector client
      register: result
      vyos.vyos.vyos_bgp_address_family: &id010
        config:
          as_number: 65536
          neighbors:
            - neighbor_address: 192.0.2.50
              address_family:
                - afi: ipv4-vpn
                  route_reflector_client: true
                  nexthop_self: true
                - afi: ipv6-vpn
                  route_reflector_client: true
        state: merged

    - vyos.vyos.vyos_facts:
        gather_network_resources: bgp_address_family

    - assert:
        that:
          - result.changed == true
          - result.commands | symmetric_difference(expected) == []
          - result.after == ansible_facts['network_resources']['bgp_address_family']
      vars:
        expected:
          - set protocols bgp neighbor 192.0.2.50 address-family ipv4-vpn route-reflector-client
          - set protocols bgp neighbor 192.0.2.50 address-family ipv4-vpn nexthop-self
          - set protocols bgp neighbor 192.0.2.50 address-family ipv6-vpn route-reflector-client

    - name: Merge VPN address families for a route-reflector client (IDEMPOTENT)
      register: result
      vyos.vyos.vyos_bgp_address_family: *id010

    - name: Assert that the previous task was idempotent
      assert:
        that:
          - result['changed'] == false

  when: vyos_version is version('1.4.0', '>=', version_type='semver')
  always:
    - include_tasks: _remove_config.yaml

- block:
    - name: setup a neighbor
      vyos.vyos.vyos_config:
        lines:
          - set protocols bgp system-as 65536
          - set protocols bgp neighbor 192.0.2.60 remote-as 65002
      vars:
        ansible_connection: ansible.netcommon.network_cli

    - name: Merge an address family without options (activate the neighbor)
      register: result
      vyos.vyos.vyos_bgp_address_family: &id011
        config:
          as_number: 65536
          neighbors:
            - neighbor_address: 192.0.2.60
              address_family:
                - afi: ipv4
        state: merged

    - vyos.vyos.vyos_facts:
        gather_network_resources: bgp_address_family

    - assert:
        that:
          - result.changed == true
          - result.commands == ['set protocols bgp neighbor 192.0.2.60 address-family ipv4-unicast']
          - result.after == ansible_facts['network_resources']['bgp_address_family']

    - name: Merge an address family without options (IDEMPOTENT)
      register: result
      vyos.vyos.vyos_bgp_address_family: *id011

    - name: Assert that the previous task was idempotent
      assert:
        that:
          - result['changed'] == false

  when: vyos_version is version('1.4.0', '>=', version_type='semver')
  always:
    - include_tasks: _remove_config.yaml

- block:
    - name: setup a neighbor
      vyos.vyos.vyos_config:
        lines:
          - set protocols bgp system-as 65536
          - set protocols bgp neighbor 192.0.2.70 remote-as 65002
      vars:
        ansible_connection: ansible.netcommon.network_cli

    - name: Merge default-originate without a route map
      register: result
      vyos.vyos.vyos_bgp_address_family: &id012
        config:
          as_number: 65536
          neighbors:
            - neighbor_address: 192.0.2.70
              address_family:
                - afi: ipv4
                  default_originate: true
        state: merged

    - vyos.vyos.vyos_facts:
        gather_network_resources: bgp_address_family

    - assert:
        that:
          - result.changed == true
          - result.commands == ['set protocols bgp neighbor 192.0.2.70 address-family ipv4-unicast default-originate']
          - result.after == ansible_facts['network_resources']['bgp_address_family']

    - name: Merge default-originate without a route map (IDEMPOTENT)
      register: result
      vyos.vyos.vyos_bgp_address_family: *id012

    - name: Assert that the previous task was idempotent
      assert:
        that:
          - result['changed'] == false

  when: vyos_version is version('1.4.0', '>=', version_type='semver')
  always:
    - include_tasks: _remove_config.yaml
