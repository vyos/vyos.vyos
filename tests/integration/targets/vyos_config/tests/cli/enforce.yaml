---
- debug: msg="START cli/enforce.yaml on connection={{ ansible_connection }}"

# SAFETY: this file exercises match=enforce's full end-state enforcement,
# which deletes anything not present in the candidate. Never touch
# service ssh, interface/IP addressing, routing, or firewall config here --
# those are load-bearing for the management connection this test runs over.
# Stick to inert subtrees only (lldp, bare protocols static, ntp, etc).

- name: setup baseline config
  vyos.vyos.vyos_config:
    lines:
      - set system host-name {{ inventory_hostname_short }}
      - set service lldp
      - set protocols static
    match: none

- name: enforce end-state with match=enforce (should remove lldp, keep static, add ntp)
  register: result
  vyos.vyos.vyos_config:
    lines:
      - set system host-name {{ inventory_hostname_short }}
      - set protocols static
      - set service ntp server 192.0.2.1
    match: enforce

- assert:
    that:
      - result.changed == true
      - "'delete service lldp' in result.commands"
      - "'set service ntp server 192.0.2.1' in result.commands"
      - "'delete protocols static' not in result.commands"

- name: check match=enforce is idempotent against the same end-state
  register: result
  vyos.vyos.vyos_config:
    lines:
      - set system host-name {{ inventory_hostname_short }}
      - set protocols static
      - set service ntp server 192.0.2.1
    match: enforce

- assert:
    that:
      - result.changed == false

- name: match=enforce tolerates blank lines and comments in the candidate
  register: result
  vyos.vyos.vyos_config:
    lines:
      - "# this is a comment"
      - ""
      - set system host-name {{ inventory_hostname_short }}
      - set protocols static
      - set service ntp server 192.0.2.1
    match: enforce

- assert:
    that:
      - result.changed == false

- name: match=enforce rejects an incomplete set command
  register: result
  ignore_errors: true
  vyos.vyos.vyos_config:
    lines:
      - set system host-name {{ inventory_hostname_short }}
      - set
    match: enforce

- assert:
    that:
      - result.failed == true

- name: match=enforce rejects delete lines in the candidate
  register: result
  ignore_errors: true
  vyos.vyos.vyos_config:
    lines:
      - set system host-name {{ inventory_hostname_short }}
      - delete protocols static
    match: enforce

- assert:
    that:
      - result.failed == true

- name: teardown
  vyos.vyos.vyos_config:
    lines:
      - set system host-name {{ inventory_hostname_short }}
    match: none

- name: remove leftover test config
  vyos.vyos.vyos_config:
    lines:
      - delete service ntp
      - delete protocols static
      - delete service lldp
    match: none
  ignore_errors: true

- debug: msg="END cli/enforce.yaml on connection={{ ansible_connection }}"
