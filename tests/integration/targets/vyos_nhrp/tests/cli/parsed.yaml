---
- debug:
    msg: START vyos_nhrp parsed integration tests on connection={{ ansible_connection }}

- name: Parse the provided running configuration
  register: result
  vyos.vyos.vyos_nhrp:
    running_config: "{{ lookup('file', '_parsed.cfg') }}"
    state: parsed

- assert:
    that:
      - result.changed == false
      - result.parsed == parsed.after
